# Continuous integration for dsh-workspace-running-indicator.
#
# Mirrors what `pnpm check` does locally — typecheck the host half, the browser
# half and the tests, build the loader bundle, then run the suite against that
# artifact — so a green badge means the same thing here as on a contributor's
# machine.
#
# The browser half imports nothing outside its own sources, so a clean checkout
# needs no @deepseek-ai packages to build or test; jsdom and the TypeScript
# toolchain are the whole dependency set. `pnpm/action-setup` reads
# `packageManager` from package.json, which is why no version is repeated here.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Read-only: this workflow never writes to the repository.
permissions:
  contents: read

# One run per branch/PR; a new push cancels the in-progress run instead of queueing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  check:
    name: typecheck · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from package.json "packageManager" (pnpm@11.8.0).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # package.json declares "node": ">=22.17.0"; 22 is the current LTS line.
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # pnpm 11 reads build-script approval from pnpm-workspace.yaml
      # (allowBuilds: esbuild), which is what makes vitest and tsdown usable.
      - name: Typecheck
        run: pnpm typecheck

      # The bundle specs load lib/client.js, so the build must precede the tests.
      - name: Build the bundle
        run: pnpm build

      - name: Test
        run: pnpm test
